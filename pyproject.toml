[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-os"
version = "0.1.0"
description = "A local-first Codex-style AI operator for Ollama, GGUF, and OpenAI-compatible LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alice OS contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface_hub>=0.32,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
alice = "alice_os.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools/OpenVoice"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
